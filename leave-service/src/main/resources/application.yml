server:
  port: 8083

spring:

  application:
    name: leave-service

  datasource:
    url: jdbc:mysql://localhost:3307/enterprise_ai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true


jwt:
  secret: enterprise-ai-platform-secret-key-change-this-in-production-2026


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

    register-with-eureka: true
    fetch-registry: true


management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always