server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      discovery:
        locator:
          enabled: false

      routes:

        # =========================
        # AUTH SERVICE
        # =========================
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # =========================
        # EMPLOYEE SERVICE
        # =========================
        - id: employee-service
          uri: lb://EMPLOYEE-SERVICE
          predicates:
            - Path=/api/employees/**

        # =========================
        # LEAVE SERVICE
        # =========================
        - id: leave-service
          uri: lb://LEAVE-SERVICE
          predicates:
            - Path=/api/leaves/**

        # =========================
        # DOCUMENT SERVICE
        # =========================
        - id: document-service
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/api/documents/**

        # =========================
        # AI SERVICE
        # =========================
        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api/ai/**

        # =========================
        # NOTIFICATION SERVICE
        # =========================
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**


jwt:
  secret: "enterprise-ai-platform-secret-key-2026-secure-jwt-key"


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

    register-with-eureka: true
    fetch-registry: true


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always