server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: employee-service
              uri: lb://employee-service
              predicates:
                - Path=/api/employees/**

            - id: leave-service
              uri: lb://leave-service
              predicates:
                - Path=/api/leaves/**

            - id: document-service
              uri: lb://document-service
              predicates:
                - Path=/api/documents/**

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway

  endpoint:
    health:
      show-details: always

    gateway:
      access: unrestricted