server:
  port: 8888

spring:

  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: file:${user.dir}/config-repo
          default-label: master
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - env

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.config: INFO